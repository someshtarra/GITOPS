apiVersion: v1
kind: Service
metadata:
  name: project-management-service
  namespace: default
  labels:
    app: project-management
spec:
  type: LoadBalancer # LoadBalancer service for AWS EKS / Cloud Kubernetes
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: project-management
